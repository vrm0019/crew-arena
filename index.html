<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e6e6e6;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      text-align: center;
      font-weight: 600;
      margin: 0 0 24px;
    }
    form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1e1e1e;
      color: #e6e6e6;
      font-size: 16px;
    }
    input[type="text"]:focus {
      outline: 2px solid #4a9eff;
      border-color: transparent;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #4a9eff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #3a8ae6; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
    }
    li span {
      flex: 1;
      word-break: break-word;
    }
    li.done span {
      text-decoration: line-through;
      color: #888;
    }
    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .delete {
      background: #3a3a3a;
      padding: 6px 10px;
      font-size: 13px;
    }
    .delete:hover { background: #c0392b; }
    .empty {
      text-align: center;
      color: #777;
      font-style: italic;
    }
    .footer {
      margin-top: 16px;
      font-size: 14px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Lista de tareas</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Escribe una tarea..." autocomplete="off" aria-label="Nueva tarea" required>
      <button type="submit">Añadir</button>
    </form>

    <ul id="task-list" aria-live="polite"></ul>
    <p class="empty" id="empty-msg" hidden>No hay tareas pendientes.</p>

    <p class="footer" id="counter"></p>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "todo-tasks-v1";

      const form = document.getElementById("task-form");
      const input = document.getElementById("task-input");
      const list = document.getElementById("task-list");
      const emptyMsg = document.getElementById("empty-msg");
      const counter = document.getElementById("counter");

      let tasks = loadTasks();

      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
          console.error("No se pudieron leer las tareas guardadas:", err);
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (err) {
          console.error("No se pudieron guardar las tareas:", err);
        }
      }

      function render() {
        list.innerHTML = "";

        tasks.forEach(function (task) {
          const li = document.createElement("li");
          if (task.done) li.classList.add("done");

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.setAttribute("aria-label", "Marcar como completada: " + task.text);
          checkbox.addEventListener("change", function () {
            task.done = checkbox.checked;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.textContent = task.text;

          const del = document.createElement("button");
          del.type = "button";
          del.className = "delete";
          del.textContent = "Eliminar";
          del.setAttribute("aria-label", "Eliminar tarea: " + task.text);
          del.addEventListener("click", function () {
            tasks = tasks.filter(function (t) { return t.id !== task.id; });
            saveTasks();
            render();
          });

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(del);
          list.appendChild(li);
        });

        emptyMsg.hidden = tasks.length > 0;

        const pending = tasks.filter(function (t) { return !t.done; }).length;
        counter.textContent = tasks.length === 0
          ? ""
          : pending + " de " + tasks.length + " pendientes";
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        tasks.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          text: text,
          done: false
        });

        input.value = "";
        input.focus();
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
